[project]
name = "solarcast"
version = "0.1.0"
description = "Modular framework for solar energy time-series analysis"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "pvlib>=0.11",
    "scikit-learn>=1.5",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
solarcast-ingest = "solarcast.scripts.ingest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solarcast*"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
